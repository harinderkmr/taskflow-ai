

services:

  backend:
    build: ./backend

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    env_file:
      - backend/.env

    depends_on:
      - db
      - redis

  frontend:

    build: ./frontend

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    depends_on:
      - backend

  db:

    image: postgres:17

    environment:

      POSTGRES_DB: taskflow

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

  redis:

    image: redis:7-alpine

    ports:

      - "6379:6379"

volumes:

  postgres_data: